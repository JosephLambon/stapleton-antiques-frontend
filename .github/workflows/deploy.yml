name: Deploy Static Web App

on:
  push:
    branches:
      - development
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - development
      - main
  workflow_dispatch:

jobs:
  dev:
    if: github.event_name == 'push' && github.ref_name == 'development'
    runs-on: ubuntu-latest
    name: Deploy to Dev
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy (DEV)
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_TOKEN_DEV }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/" 
          api_location: "" 
          output_location: "dist"

  test:
    needs: dev # This creates the chain
    if: github.event_name == 'push' && github.ref_name == 'development'
    runs-on: ubuntu-latest
    name: Deploy to Test
    environment: Test # <--- Triggers the Manual Approval Gate
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy (TEST)
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_TOKEN_TEST }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/" 
          api_location: "" 
          output_location: "dist"

  prod:
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    name: Deploy to Prod
    environment: Production # <--- Triggers the Manual Approval Gate
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy (PROD)
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_TOKEN_PROD }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/" 
          api_location: "" 
          output_location: "dist"

  # -----------------------------------------------------------------
  # JOB 4: PR PREVIEW (Ephemeral)
  # When a PR is created or updated, deploys to a staging url attached to your 'dev' resource
  # -----------------------------------------------------------------
  deploy_pr_staging:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: PR Staging Environment
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      
      # If PR is into Dev, use Dev token for Staging
      - name: Deploy PR Staging (Dev Context)
        if: github.base_ref == 'development'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_TOKEN_DEV }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          output_location: "dist"

      # # If PR is into Main, use Prod token for Staging
      # - name: Deploy PR Staging (Prod Context)
      #   if: github.base_ref == 'main'
      #   uses: Azure/static-web-apps-deploy@v1
      #   with:
      #     azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_TOKEN_PROD }}
      #     repo_token: ${{ secrets.GITHUB_TOKEN }}
      #     action: "upload"
      #     app_location: "/"
      #     output_location: "dist"

  # -----------------------------------------------------------------
  # JOB 5: CLEANUP
  # Closes PR environments
  # -----------------------------------------------------------------
  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request (DEV)
        if: github.base_ref == 'development'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_TOKEN_DEV }}
          action: "close"

      - name: Close Pull Request (PROD)
        if: github.base_ref == 'main'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_TOKEN_PROD }}
          action: "close"