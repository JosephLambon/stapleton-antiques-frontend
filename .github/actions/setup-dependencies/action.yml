name: 'Node.js Setup and Install Dependencies'
description: 'Sets up Node.js and installs dependencies with caching.'
runs:
  using: "composite"
  steps:
    - name: Setup Node.js Environment
      uses: actions/setup-node@v3
      with:
        node-version: '20' 
        cache: 'npm'
        
    - name: Install Dependencies
      run: npm install
      shell: bash